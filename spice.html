<!DOCTYPE html>
<html>
<head>
  <title>Spice Garden Restaurant</title>
</head>
<body bgcolor="#eeeeee">

  <center>
    <h1>Spice Garden Restaurant</h1>
    <p><i>Fresh food, made with love</i></p>
  </center>

  <hr>

  <center>
    <h2>Starters</h2>

    <table border="1"  width="80%">
      <tr bgcolor="#9b413b">
        <th><font color="white">Photo</font></th>
        <th><font color="white">Dish</font></th>
        <th><font color="white">Description</font></th>
        <th><font color="white">Price</font></th>
      </tr>

      <tr align="center">
        <td><img src="paneer.jpg.png" width="70" height="50"></td>
        <td><b>Paneer Tikka</b></td>
        <td>Grilled cottage cheese with spices</td>
        <td>Rs. 220</td>
      </tr>

      <tr align="center">
        <td><img src="soup.jpg.png" width="70" height="50"></td>
        <td><b>Tomato Soup</b></td>
        <td>Creamy soup with herbs</td>
        <td>Rs. 120</td>
      </tr>

      <tr align="center">
        <td><img src="rolls.jpg.png" width="70" height="50"></td>
        <td><b>Veg Spring Rolls</b></td>
        <td>Crispy rolls with vegetable filling</td>
        <td>Rs. 150</td>
      </tr>
    </table>

    <h2>Main Course</h2>
    <p><b>Indian</b></p>
  </center>

</body>
</html>
